<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WatchMusic · App Store 创意素材</title>
<style>

.search{width:1920px;height:1280px}.search .copy{position:absolute;left:145px;top:240px;width:900px}.search .brand{margin-bottom:82px}.search .headline{font-size:100px;letter-spacing:-3px;margin-top:32px}.search .sub{font-size:31px}.search .watch{position:absolute;width:500px;left:1210px;top:345px;border-radius:83px;padding:16px}.search .watch img{border-radius:68px}.search .strap{left:1295px;top:110px;width:325px;height:1090px;border-radius:80px;transform:rotate(-10deg)}.search .watch{transform:rotate(-10deg)}.search .eyebrow{font-size:25px;letter-spacing:3px}.search.en .headline{font-size:89px}.search .line{margin:42px 0 26px}.search .brand img{width:76px;height:76px;border-radius:19px}.search .brand span{font-size:41px}
.screen{width:1320px;height:2868px}.screen .top{position:absolute;left:110px;right:110px;top:140px}.screen .brand{gap:17px}.screen .brand img{width:62px;height:62px;border-radius:16px}.screen .brand span{font-size:34px}.screen .kicker{font-size:27px;color:#80baff;letter-spacing:3px;margin-top:88px;font-weight:600}.screen .headline{font-size:110px;line-height:1.24;letter-spacing:-3px;margin-top:27px;margin-bottom:28px}.screen .sub{font-size:37px;line-height:1.6;max-width:1000px}.screen .phone{position:absolute;width:880px;left:220px;top:830px;padding:10px;border-radius:65px}.screen .phone img{border-radius:54px}.screen .foot{position:absolute;left:112px;bottom:75px;color:#7191b6;font-size:24px;letter-spacing:3px}.screen.light{background:#ecf4ff;color:#101e35}.screen.light:before{background:radial-gradient(ellipse at 85% 55%,#a2caff99,transparent 55%),radial-gradient(ellipse at 10% 15%,#fff,transparent 60%)}.screen.light:after{border-color:#5085c933;box-shadow:0 0 0 130px #6ca5f408,0 0 0 260px #5b9bfa05}.screen.light .sub{color:#4a6381}.screen.light .kicker{color:#1769cc}.screen.light .brand span{color:#15305b}.screen.en .headline{font-size:97px}.screen.en .kicker{letter-spacing:4px}.screen.en .sub{font-size:35px}.screen .mini{position:absolute;width:350px;right:95px;bottom:245px;padding:12px;border-radius:67px;transform:rotate(7deg)}.screen .mini img{border-radius:55px}.screen .mini:before{top:90px;height:48px;right:-10px;width:16px}.screen.one .phone{width:850px;left:130px;top:820px}.screen.one .mini{bottom:150px;right:105px;width:360px}.screen .pill-row{display:flex;gap:14px;margin-top:29px}.screen .pill{display:inline-block;padding:13px 23px;border:1px solid #75b0f850;border-radius:99px;font-size:25px;color:#8fc1ff}.screen.light .pill{color:#1769cc;border-color:#3386db44}

<script>
const q=new URLSearchParams(location.search), type=q.get('type')||'header',lang=q.get('lang')==='en'?'en':'zh', n=Number(q.get('n')||1), isEn=lang==='en';
const raw='../screenshots/raw/', icon='brand-icon.png';
const brand=`<div class="brand"><img src="${icon}" alt=""><span>WatchMusic</span></div>`;
const watch=`<div class="watch"><img src="${raw}watch-player.png" alt="WatchMusic Apple Watch player"></div>`;
const sets={zh:[['音乐，在腕间。','离线聆听，自由出发。','把自己的音乐装进手表，<br>出门只带喜欢的旋律。','phone-player.png','APPLE WATCH · OFFLINE'],['整理好心情，<br>也整理好音乐。','你的音乐，自有秩序。','按目录收藏与整理，<br>长按即可批量操作。','phone-library.png','LOCAL LIBRARY'],['长按，多选。<br>音乐轻松整理。','一次选择，一起处理。','批量发送、移动或删除，<br>常用操作，在一处完成。','phone-selection.png','SELECT · ORGANIZE · SEND'],['选一份歌单，<br>听自己的喜欢。','每一份收藏，都有位置。','封面、歌名、歌手，一目了然。<br>选好音乐，随时开始。','phone-folder.png','YOUR MUSIC · YOUR WAY']],en:[['Your music.\nOn your wrist.','Offline listening. Ready to go.','Take your own music with you.<br>Listen offline on Apple Watch.','phone-player.png','APPLE WATCH · OFFLINE'],['A place for\nevery playlist.','Your library, your way.','Organize local files in folders.<br>Long-press to select more.','phone-library.png','LOCAL LIBRARY'],['Long-press.\nSelect more.','One selection. More possibilities.','Send, move or delete in batches.<br>Your library, easier to manage.','phone-selection.png','SELECT · ORGANIZE · SEND'],['Find a folder.\nPress play.','Your music, your moment.','Cover art, titles and artists.<br>Make room for your favorites.','phone-folder.png','YOUR MUSIC · YOUR WAY']]};
const art=document.getElementById('art');
if(type==='watch'){art.className='art native';art.innerHTML=`<img src="${raw}watch-${['player','library','folder','transfer'][n-1]}.png" alt="Apple Watch 原生界面">`;}
else if(type==='screen') {const s=sets[lang][n-1];art.className=`art screen ${isEn?'en':''} ${n===2?'light':''} ${n===1?'one':''}`;art.innerHTML=`<div class="top">${brand}<div class="kicker">${s[4]}</div><h1 class="headline">${s[0].replaceAll('\n','<br>')}</h1><div class="sub">${s[2]}</div></div><div class="phone"><img src="${raw+s[3]}" alt="${s[1]}"></div>${n===1?watch.replace('class="watch"','class="watch mini"'):''}<div class="foot">WATCHMUSIC &nbsp; / &nbsp; 0${n}</div>`;}
else if(type==='search'){art.className=`art search ${isEn?'en':''}`;art.innerHTML=`<div class="copy">${brand}<div class="eyebrow">${isEn?'YOUR LOCAL MUSIC, OFFLINE':'把喜欢的音乐，戴在手上'}</div><h1 class="headline">${isEn?'Offline music.<br>On your Watch.':'手表离线听歌。<br><span class="accent">自己的音乐，随身。</span>'}</h1><div class="line"></div><div class="sub">${isEn?'Import. Transfer. Take it with you.':'导入本地音乐 · 局域网传输 · 独立播放'}</div></div><div class="strap"></div>${watch}`;}
else{art.className=`art header ${isEn?'en':''}`;art.innerHTML=`<div class="orb"></div><div class="copy">${brand}<div class="eyebrow">${isEn?'YOUR MUSIC. WITH YOU.':'随身音乐 · WATCHMUSIC'}</div><h1 class="headline">${isEn?'Your music.<br><span class="accent">A little closer.</span>':'让音乐，<br><span class="accent">轻一点出发。</span>'}</h1><div class="sub">${isEn?'Listen offline. Live in the moment.':'把喜欢的旋律，留在腕间。'}</div></div><div class="strap"></div>${watch}`;}
</script></body></html>
